<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: inline-block;
    }

    #app {
      display: inline-flex;
      align-items: flex-start;
      justify-content: flex-start;
      margin: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
    }

    #sticker {
      display: block;
      width: 132px;
      max-width: min(36vw, 168px);
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    function readSticker(value) {
      if (!value || typeof value !== "object") return null;
      return value.sticker || value;
    }

    function escapeAttr(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[char]);
    }

    function fitHeight() {
      requestAnimationFrame(() => {
        const height = Math.ceil(
          document.documentElement.getBoundingClientRect().height
        );
        window.openai?.notifyIntrinsicHeight?.(height);
      });
    }

    function persist(sticker) {
      if (typeof window.openai?.setWidgetState !== "function") return;

      window.openai.setWidgetState({
        id: sticker.id || "",
        name: sticker.name || "",
        labels: Array.isArray(sticker.labels) ? sticker.labels : [],
        imageUrl: sticker.imageUrl,
      });
    }

    function render(value, shouldPersist = true) {
      const sticker = readSticker(value);
      if (!sticker?.imageUrl) return;

      app.innerHTML =
        '<img id="sticker" src="' +
        escapeAttr(sticker.imageUrl) +
        '" alt="' +
        escapeAttr(sticker.name || "表情包") +
        '" />';

      if (shouldPersist) persist(sticker);

      document
        .getElementById("sticker")
        ?.addEventListener("load", fitHeight, { once: true });

      fitHeight();
    }

    function renderFromGlobals(event) {
      const globals = event?.detail?.globals;

      const toolOutput =
        globals?.toolOutput ||
        window.openai?.toolOutput;

      const savedState =
        globals?.widgetState ||
        window.openai?.widgetState;

      if (toolOutput) {
        render(toolOutput, true);
      } else if (savedState) {
        render(savedState, false);
      }
    }

    window.addEventListener("openai:set_globals", renderFromGlobals);
    renderFromGlobals();

    window.addEventListener(
      "message",
      (event) => {
        if (event.source !== window.parent) return;

        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === "ui/notifications/tool-result") {
          render(message.params?.structuredContent, true);
        }
      },
      { passive: true }
    );
  </script>
</body>
</html>
