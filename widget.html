<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 124px;
      min-width: 124px;
      height: 124px;
      min-height: 124px;
      overflow: hidden;
      background: transparent;
    }

    #app {
      display: block;
      width: 124px;
      height: 124px;
      margin: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    #sticker {
      display: block;
      width: 124px;
      height: 124px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 10px;
      box-shadow: none;
      background: transparent;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    function readSticker(value) {
      if (!value || typeof value !== "object") return null;
      return value.sticker || value;
    }

    function escapeAttr(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function fitHeight() {
      requestAnimationFrame(() => {
        window.openai?.notifyIntrinsicHeight?.(124);
      });
    }

    function render(value, persist = true) {
      const sticker = readSticker(value);
      const src = sticker?.imageDataUri || sticker?.imageUrl;
      if (!src) return;

      app.innerHTML =
        '<img id="sticker" src="' +
        escapeAttr(src) +
        '" alt="" />';

      if (persist && typeof window.openai?.setWidgetState === "function") {
        window.openai.setWidgetState({
          id: sticker.id || "",
          name: sticker.name || "",
          labels: Array.isArray(sticker.labels) ? sticker.labels : [],
          imageUrl: sticker.imageUrl || "",
          imageDataUri: sticker.imageDataUri || ""
        });
      }

      document.getElementById("sticker")?.addEventListener("load", fitHeight, { once: true });
      fitHeight();
    }

    function sync(event) {
      const globals = event?.detail?.globals;
      render(
        globals?.toolOutput ||
        window.openai?.toolOutput ||
        globals?.widgetState ||
        window.openai?.widgetState,
        Boolean(globals?.toolOutput || window.openai?.toolOutput)
      );
    }

    window.addEventListener("openai:set_globals", sync);
    sync();

    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;

      if (message.method === "ui/notifications/tool-result") {
        render(message.params?.structuredContent, true);
      }
    }, { passive: true });
  </script>
</body>
</html>
