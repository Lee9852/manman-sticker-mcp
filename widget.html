<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>满满表情包</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      width: 100%;
      min-height: 0;
    }
    #app {
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      line-height: 0;
      text-align: center;
    }
    img {
      display: inline-block;
      width: clamp(112px, 30vw, 136px);
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 10px;
      box-shadow: none;
      object-fit: contain;
      background: transparent;
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.getElementById("app");

    function unwrap(value) {
      if (!value || typeof value !== "object") return null;
      return value.sticker || value;
    }

    function syncHeight() {
      requestAnimationFrame(() => {
        window.openai?.notifyIntrinsicHeight?.(
          Math.ceil(document.documentElement.getBoundingClientRect().height)
        );
      });
    }

    function render(value, persist = false) {
      const sticker = unwrap(value);
      if (!sticker?.imageUrl) return;

      app.innerHTML =
        '<img id="sticker-image" src="' +
        escapeAttr(sticker.imageUrl) +
        '" alt="" />';

      if (persist && typeof window.openai?.setWidgetState === "function") {
        window.openai.setWidgetState({
          imageUrl: sticker.imageUrl,
          name: sticker.name || "",
          sticker
        });
      }

      const image = document.getElementById("sticker-image");
      image?.addEventListener("load", syncHeight, { once: true });
      syncHeight();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function readOpenAIState(event) {
      const globals = event?.detail?.globals;
      const state = globals?.widgetState || window.openai?.widgetState;
      render(
        globals?.toolOutput ||
        window.openai?.toolOutput ||
        state?.sticker ||
        state
      );
    }

    window.addEventListener("openai:set_globals", readOpenAIState);
    readOpenAIState();

    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;

      if (message.method === "ui/notifications/tool-result") {
        render(message.params?.structuredContent, true);
      }
    }, { passive: true });
  </script>
</body>
</html>
