<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>满满的表情包 MCP</title>
    <style>
      :root { font-family: "PingFang SC", system-ui, sans-serif; color: #342925; background: #fbf7f4; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 660px); padding: 34px; border: 1px solid #eadbd3; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px #6f4b3a14; }
      h1 { margin: 0 0 12px; font-size: clamp(25px, 6vw, 38px); }
      p { line-height: 1.75; }
      code { padding: 3px 7px; border-radius: 8px; background: #f3ebe7; }
      .ok { color: #2e7d5b; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="ok">服务运行正常</p>
      <h1>满满的表情包 MCP</h1>
      <p>已经装好 29 张小猫表情，可以按语气搜索，再以图片卡片显示。</p>
      <p>MCP 地址：<code id="endpoint">/mcp</code></p>
    </main>
    <script>document.getElementById("endpoint").textContent = `${location.origin}/mcp`;</script>
  </body>
</html>
